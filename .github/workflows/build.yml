name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        run: gradle build --stacktrace
      - name: Functional GameTest smoke
        run: gradle runGametest --stacktrace
      - name: Integrated client GameTest smoke
        run: gradle runClientGameTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-multi-fishing
          path: |
            build/libs/*.jar
            build/junit.xml
            build/run/clientGameTest/screenshots/**
